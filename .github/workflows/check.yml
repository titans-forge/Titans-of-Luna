name: Static game checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 luna_smoke.py
      - name: Verify approved release license
        run: python3 -c "import hashlib,pathlib; assert hashlib.sha256(pathlib.Path('LICENSE').read_bytes()).hexdigest() == '28638be413f7815704fe68aed52a4ea4cb7bd4d28b35f2dca9b78d438a4a90bf'"
